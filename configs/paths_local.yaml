# Local path config for this workstation.
#
# Principle:
# - Code stays in project_root on D:.
# - Large data stays in data_root on G:.
# - path_utils.py resolves outputs/, captures/, results/, logs/, models/*.pt
#   and FZmotion_Data/ to the G-drive roots below.
# - Do not commit large captures, videos, labels, train runs, or model weights.
paths:
  project_root: "D:/Research/YOLO6D_Car"
  data_root: "G:/YOLO6D_Car_Data"
  fzmotion_root: "G:/YOLO6D_Car_Data/FZmotion_Data"
  captures_root: "G:/YOLO6D_Car_Data/captures"
  outputs_root: "G:/YOLO6D_Car_Data/outputs"
  models_root: "G:/YOLO6D_Car_Data/models"
  results_root: "G:/YOLO6D_Car_Data/results"
  logs_root: "G:/YOLO6D_Car_Data/logs"
