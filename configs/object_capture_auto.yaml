camera:
  source: "d455"
  width: 1280
  height: 720
  fps: 15
  enable_depth: true
  align_depth_to_color: true

capture:
  mode: "auto"
  session_name: "car_auto_capture_001"
  object_name: "car"
  target_samples: 500

  min_time_between_samples_s: 1.0
  stable_frames_required: 5

  blur_threshold: 80.0
  frame_difference_threshold: 8.0
  min_scene_change_score: 0.05
  min_position_change_px: 30.0
  min_scale_change_ratio: 0.08

  save_rgb: true
  save_depth: false
  save_preview: true
  save_metadata: true

  auto_stop_when_target_reached: true

output:
  root: "captures"
  date_format: "%Y-%m-%d"

mocap:
  enabled: false
  csv_path: null
  note: "Mocap can be added later. This script only captures images and metadata."
