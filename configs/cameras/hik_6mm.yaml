# Hikrobot MV-CS016-10UC + 6mm 镜头。
# 6mm 与 8mm 必须分别标定、分别管理内参。
camera:
  source: hikrobot
  lens: 6mm
  device_index: 0
  width: 1440
  height: 1080
  fps: 60
  enable_depth: false
  align_depth_to_color: false
  exposure_time_us: 5000
  exposure_auto: "off"
  gain_db: 14
  gain_auto: "off"
  gamma: 1.0
  white_balance: "continuous"
  trigger_mode: "off"
  pixel_format: BGR8
  grab_timeout_ms: 1000
  mvs_python_path: "E:/MVS/Development/Samples/Python/MvImport"
  intrinsics_path: "outputs/calibration/hik_6mm/camera_intrinsics_hik_6mm.yaml"
