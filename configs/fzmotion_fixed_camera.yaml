# =========================
# 相机配置
# =========================
camera:
  source: d455                 # 使用的相机类型（这里是 Intel RealSense D455）
  color_width: 1280           # RGB 图像宽度（像素）
  color_height: 720           # RGB 图像高度（像素）
  fps: 15                     # 帧率（每秒帧数）
  enable_depth: true          # 是否开启深度图（D455支持深度）
  align_depth_to_color: true  # 是否将深度图对齐到彩色图（必须开启，保证像素对应）

# =========================
# 动捕系统配置（最关键部分）
# =========================
mocap:
  enabled: true               # 是否启用动捕数据
  mode: csv                   # 数据来源类型（这里是CSV文件）
  csv_path: D:\YOLO6D_Car\FZmotion_Data\Data 2026-03-26 17-17-44.csv  # 动捕数据文件路径

  # 相机刚体名称（动捕里的名称）
  camera_rigid_body: Rigid1

  # 小车刚体名称（动捕里的名称）
  object_rigid_body: Rigid0

  # 图像与动捕的最大允许时间差（30ms）
  max_time_diff_s: 0.03
  time_offset_s: 0.0

  # 坐标系命名
  camera_optical_frame: camera_optical
  object_model_frame: car_model

  # 相机刚体 -> 相机光学坐标系
  T_camera_rigid_to_optical:
    translation_m: [0.004496242782545951, 0.06085046472645088, -0.044793392192612774]
    quaternion_xyzw: [0.9993583520083644, 0.02577533993950418, 0.02304670212384463, -0.009346959042583257]


  # 世界坐标系 -> 相机光学坐标系（最重要）
  # 必须通过固定相机标定得到，否则无法把 Rigid0 转成相机坐标系下的真值位姿
  T_world_camera_optical: null
  # 示例：
  # T_world_camera_optical:
  #   translation_m: [0.0, 0.0, 0.0]
  #   quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

  # 小车刚体 -> 小车模型坐标系
  T_object_rigid_to_model:
    translation_m: [0.0, 0.0, 0.0]
    quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

# =========================
# 小车3D模型配置
# =========================
object_model:
  label: car_model
  keypoints_mode: custom
  model_json_path: models/car_custom_keypoints_12.json
  include_center: false

# =========================
# YOLO6D配置
# =========================
yolo6d:
  backend: json_replay        # 当前还是回放模式，不是真实模型推理
  conf_threshold: 0.25
  replay_json_path: data/examples/custom_model_12pt_predictions.json
  replay_timestamp_tolerance_s: 0.05
  pnp:
    ransac_reproj_threshold_px: 4.0
    iterations_count: 100
    confidence: 0.99
    min_keypoint_score: 0.20

# =========================
# 输出配置
# =========================
output:
  print_json_lines: true
  show_window: true
  save_csv: outputs/fzmotion_pose_log.csv






