# G-drive version of board_capture.yaml.
# Use with: --paths-config configs/paths_local.yaml

camera:
  source: d455
  color_width: 640
  color_height: 480
  fps: 30
  enable_depth: false
  align_depth_to_color: false

mocap:
  enabled: true
  mode: csv
  csv_path: FZmotion_Data/current_rigids_recalib_20260410.csv
  camera_rigid_body: Rigid1
  object_rigid_body: Rigid0
  max_time_diff_s: 0.03
  time_offset_s: 0.0
  camera_optical_frame: camera_optical
  object_model_frame: car_model
  T_camera_rigid_to_optical: null
  T_world_camera_optical: null
  T_object_rigid_to_model:
    translation_m: [0.0, 0.0, 0.0]
    quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

object_model:
  label: car_model
  keypoints_mode: cuboid
  dimensions_m: [0.25, 0.25, 0.15]
  include_center: true

yolo6d:
  backend: json_replay
  conf_threshold: 0.25
  replay_json_path: data/examples/sample_predictions.json
  replay_timestamp_tolerance_s: 0.05
  pnp:
    ransac_reproj_threshold_px: 4.0
    iterations_count: 100
    confidence: 0.99
    min_keypoint_score: 0.20

output:
  print_json_lines: true
  show_window: false
  save_csv: outputs/fzmotion_pose_log.csv

