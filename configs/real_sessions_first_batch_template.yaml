dataset:
  name: "car_fast6d_first_real_batch"
  description: "First real lab validation batch for small-car 6DoF pose estimation."
  data_root: "G:/YOLO6D_Car_Data"
  created_by: "Yiyang"
  version: "v1"

sessions:
  - session_id: "TODO_DATE_car_static_001"
    date: "TODO_DATE"
    object: "car"
    camera:
      type: "hikrobot"
      lens: "6mm"
      intrinsics: "outputs/calibration/hik_6mm/camera_intrinsics_hik_6mm.yaml"
    mocap:
      enabled: true
      csv_path: "FZmotion_Data/raw_csv/TODO_DATE_car_static_001.csv"
      camera_rigid: "hik_rigid"
      object_rigid: "car_rigid"
    capture:
      root: "captures/TODO_DATE/TODO_DATE_car_static_001"
      images_dir: "images"
      videos_dir: "videos"
      metadata: "capture_metadata.json"
    motion:
      type: "static"
      speed_level: "static"
      occlusion: "none"
      lighting: "normal"
      background: "lab"
    outputs:
      auto_labels: "outputs/auto_labels/TODO_DATE_car_static_001"
      dataset_split: "train"
      replay_config: "outputs/replay_configs/TODO_DATE_car_static_001.yaml"
      ablation_run_name: "TODO_DATE_car_static_001"

