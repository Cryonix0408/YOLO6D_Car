# Phase B2 复制兼容迁移版本。
# 旧配置 configs/local_smoke_replay.yaml 仍保留。
# 本文件位于 configs/replay/，相对路径已按新位置调整。
# Local no-camera smoke test config for a fresh machine.

camera:
  source: d455
  color_width: 1280
  color_height: 720
  fps: 15
  enable_depth: false
  align_depth_to_color: false

mocap:
  enabled: false
  mode: csv
  csv_path: ''
  camera_rigid_body: Rigid1
  object_rigid_body: Rigid0
  max_time_diff_s: 0.03
  time_offset_s: 0.0
  camera_optical_frame: camera_optical
  object_model_frame: car_model
  T_camera_rigid_to_optical: null
  T_world_camera_optical: null
  T_object_rigid_to_model:
    translation_m: [0.0, 0.0, 0.0]
    quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

object_model:
  label: car_model
  keypoints_mode: custom
  model_json_path: ../models/car_custom_keypoints_12_migrated_200xx_exact.json
  include_center: false

yolo6d:
  backend: json_replay
  conf_threshold: 0.25
  replay_json_path: ../data/examples/custom_model_12pt_predictions.json
  replay_timestamp_tolerance_s: 0.05
  pnp:
    ransac_reproj_threshold_px: 4.0
    iterations_count: 100
    confidence: 0.99
    min_keypoint_score: 0.20

output:
  print_json_lines: false
  show_window: false
  save_csv: null
